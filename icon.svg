<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F47920"/>
      <stop offset="100%" style="stop-color:#660099"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Bottom orange bar -->
  <rect x="0" y="480" width="512" height="32" rx="0" fill="#F47920"/>
  <rect x="0" y="468" width="512" height="14" rx="0" fill="#F47920" opacity="0.4"/>
  <!-- Fiber cables - curved lines -->
  <path d="M80 320 Q180 200 256 180 Q332 160 420 100" stroke="url(#accent)" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M80 360 Q180 260 256 240 Q332 220 420 160" stroke="#F47920" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M80 400 Q180 310 256 290 Q332 270 420 210" stroke="#660099" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M80 280 Q180 150 256 130 Q332 110 420 60" stroke="#9933CC" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Connector box left -->
  <rect x="50" y="240" width="60" height="200" rx="12" fill="url(#accent)"/>
  <!-- Connector box right -->
  <rect x="400" y="40" width="60" height="200" rx="12" fill="url(#accent)"/>
  <!-- Light dots on right connector -->
  <circle cx="430" cy="80"  r="8" fill="#fff" opacity="0.9"/>
  <circle cx="430" cy="110" r="8" fill="#F47920" opacity="0.9"/>
  <circle cx="430" cy="140" r="8" fill="#22c55e" opacity="0.9"/>
  <circle cx="430" cy="170" r="8" fill="#3b82f6" opacity="0.9"/>
  <circle cx="430" cy="200" r="8" fill="#a855f7" opacity="0.9"/>
  <!-- "FO" text -->
  <text x="256" y="460" text-anchor="middle" font-family="'Courier New', monospace" font-size="72" font-weight="900" fill="#ffffff" opacity="0.15">FO</text>
</svg>
